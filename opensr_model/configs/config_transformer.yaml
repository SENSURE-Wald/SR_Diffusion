name: "swin2sr"

transformer_config:
  upscale: 4
  in_chans: 13
  depths: [6, 6, 6, 6]
  embed_dim: 90
  img_range: 1.
  img_size: 64
  mlp_ratio: 2
  num_heads: [6, 6, 6, 6]
  resi_connection: 1conv
  upsampler: pixelshuffle
  window_size: 16
  ndvi_loss: True
  output_chans: 4

testing_config:
  batch_size: 6
  pin_memory: False
  seed: 42
  num_workers: 32
  device: [2]
  metrics: ["PSNR", "SSIM", "LPIPS"]
  checkpoint: "logs/config_transformer_rgbi_vine-bread"
  